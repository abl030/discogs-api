[package]
name = "discogs-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "discogs-import"
path = "src/import.rs"

[[bin]]
name = "discogs-api"
path = "src/server.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", features = ["stream"] }
tracing = "0.1"
tracing-subscriber = "0.3"
